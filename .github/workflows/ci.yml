name: CI

on:
  push:
    branches: [main]
  pull_request:

# Нэг салбарт шинэ push ирэхэд хуучин ажиллагааг цуцална
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Хамаарал суулгах
        run: npm ci

      - name: Migration шинэ эсэхийг шалгах
        run: |
          npm run db:migrate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::Схем өөрчлөгдсөн ч migration үүсгээгүй байна."
            git status --short packages/db/drizzle
            exit 1
          fi

      - name: Төрлийн шалгалт
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Тест (бодит Postgres — PGlite)
        run: npm run test

      # Critical-ыг хэзээ ч зөвшөөрөхгүй. Засваргүй high-ууд (Expo/Metro-ийн
      # build хэрэгсэл) docs/SECURITY.md-д бүртгэлтэй, Dependabot долоо хоног
      # бүр шалгана.
      - name: Аюулгүй байдал — critical байж БОЛОХГҮЙ
        run: npm audit --audit-level=critical

      - name: Production build (вэб экспорт + Next)
        run: npm run build
        env:
          SESSION_SECRET: ci-build-only

      - name: Агуулгын хүснэгт (content/questions.csv)
        run: npm run content:check

      # Вэб бол одоогийн бүтээгдэхүүн, апп нь 2-р шат. Нийтлэг код натив
      # bundle-ийг эвдээгүйг шалгана.
      - name: Натив bundle (Android + iOS)
        working-directory: apps/mobile
        run: |
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform ios --output-dir /tmp/export-ios
